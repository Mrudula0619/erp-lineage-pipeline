# NOTE: written for convenience; not exercised in the environment this project was built in
# (no Docker daemon there). The non-Docker path in the README is the one that was tested.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
      POSTGRES_DB: erp_pipeline
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d erp_pipeline"]
      interval: 2s
      retries: 30

  erp:
    build: .
    command: python -m erp_sim.server --host 0.0.0.0 --port 8081 --flaky 0.1
    ports: ["8081:8081"]

  pipeline:
    build: .
    depends_on:
      db: {condition: service_healthy}
      erp: {condition: service_started}
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: pipeline
      PGPASSWORD: pipeline
      PGDATABASE: erp_pipeline
    command: python -m pipeline.cli run --base-url http://erp:8081
